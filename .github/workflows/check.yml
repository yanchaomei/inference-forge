name: CPU contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python -m pytest tests/test_campaign.py tests/test_task.py tests/test_evaluate.py tests/test_replay.py tests/test_processes.py tests/test_8b_export.py tests/test_cli.py -q
      - run: python -m compileall -q engines/qwen3_8b_kv engines/qwen3_8b_sessions experiments/qwen3_8b
      - run: python -m pip install build
      - run: python -m build
      - name: Install wheel outside the source checkout
        run: |
          python -m venv "$RUNNER_TEMP/forge-wheel"
          "$RUNNER_TEMP/forge-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/forge-wheel/bin/inference-forge" --help
          "$RUNNER_TEMP/forge-wheel/bin/inference-forge" serve --help
          "$RUNNER_TEMP/forge-wheel/bin/inference-forge" models --json
          "$RUNNER_TEMP/forge-wheel/bin/inference-forge" doctor --json
          "$RUNNER_TEMP/forge-wheel/bin/python" -c 'import importlib.util; assert importlib.util.find_spec("forge.backends.qwen2.engine") is not None'
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
  serving-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[inference,test]' 'openai>=1.50,<3'
      - name: Run the SDK against the installed HTTP server
        run: |
          mkdir "$RUNNER_TEMP/forge-http-tests"
          cp tests/test_serving_api.py "$RUNNER_TEMP/forge-http-tests/"
          cd "$RUNNER_TEMP/forge-http-tests"
          python -m pytest test_serving_api.py -q
