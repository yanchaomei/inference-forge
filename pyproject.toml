[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-inference-forge"
version = "0.3.0rc1"
requires-python = ">=3.10"
description = "Build and run specialized inference engines with execution feedback"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
Homepage = "https://yanchaomei.github.io/inference-forge/"
Repository = "https://github.com/yanchaomei/inference-forge"
Documentation = "https://github.com/yanchaomei/inference-forge/blob/main/docs/QUICKSTART.md"
Issues = "https://github.com/yanchaomei/inference-forge/issues"

[project.optional-dependencies]
inference = ["torch>=2.6,<3", "transformers>=5.3,<6", "safetensors>=0.7,<1"]
test = ["pytest>=8.4,<10"]
client = ["openai>=1.50,<3"]

[project.scripts]
inference-forge = "forge.cli:main"
forge-campaign = "forge.campaign:main"
forge-pilot = "forge.pilot:main"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
